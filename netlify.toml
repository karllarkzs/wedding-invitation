# Netlify detects Next.js and deploys it with its official Next.js adapter.
# These settings just pin what it would pick anyway.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # The site address is public by design (it's built into the pages for link
  # previews), so Netlify's secrets scan shouldn't fail the build over it.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL"
